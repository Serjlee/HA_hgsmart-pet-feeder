# Services for HGSmart Pet Feeder integration
feed:
  name: Feed Pets
  description: Trigger feeding with a specific number of portions
  fields:
    device_id:
      name: Device
      description: The pet feeder device to trigger
      required: true
      selector:
        device:
          integration: hgsmart
    portions:
      name: Portions
      description: Number of portions to dispense (1-9)
      required: false
      default: 1
      example: 2
      selector:
        number:
          min: 1
          max: 9
          step: 1
          mode: slider
set_schedule_days:
  name: Set Schedule Days
  description: Set which weekdays a schedule slot runs on (SF35 only)
  fields:
    device_id:
      name: Device
      description: The pet feeder device
      required: true
      selector:
        device:
          integration: hgsmart
    slot:
      name: Schedule
      description: Schedule slot number, as shown in entity names (1-10)
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: box
    days:
      name: Days
      description: Local weekdays the schedule should run on
      required: true
      example: '["mon", "wed", "fri"]'
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
